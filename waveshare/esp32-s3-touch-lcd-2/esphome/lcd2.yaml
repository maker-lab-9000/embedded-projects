  - platform: homeassistant
    id: cpu_temp
    entity_id: ${cpu_temp_entity}
    on_value:
      - lvgl.bar.update: { id: bar_cpu_temp, value: !lambda 'return (int) x;' }
      - lvgl.label.update: { id: val_cpu_temp, text: { format: "%.0f °C", args: [x] } }
