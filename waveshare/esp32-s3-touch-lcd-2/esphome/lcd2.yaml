# Waveshare ESP32-S3-Touch-LCD-2 — Home Assistant touch dashboard (ESPHome, native API).
# Pins from Waveshare's demos: LCD SPI 38/39/40, CS 45, DC 42, BL 1; touch I2C 48/47 @0x15.
# Entity IDs and names live in substitutions:. Secrets in secrets.yaml (git-ignored).
substitutions:
  name: lcd2
  friendly_name: "LCD2 Dashboard"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

spi:
  id: spi_lcd
  clk_pin: GPIO39
  mosi_pin: GPIO38
  miso_pin: GPIO40

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO1
    frequency: 1000 Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    dimensions:
      width: 240
      height: 320
    spi_id: spi_lcd
    cs_pin:
      number: GPIO45
      ignore_strapping_warning: true   # Waveshare wired LCD CS to a strapping pin; fine in practice
    dc_pin: GPIO42
    data_rate: 40MHz
    invert_colors: true      # IPS panel: Waveshare's demo constructs Arduino_ST7789 with ips=true
    color_order: bgr
    rotation: 0
    auto_clear_enabled: false
    update_interval: never   # LVGL drives redraws

i2c:
  id: i2c_tp
  sda: GPIO48
  scl: GPIO47
  frequency: 400kHz

touchscreen:
  - platform: cst816
    id: touch
    i2c_id: i2c_tp
    address: 0x15
    display: lcd
    update_interval: 50ms
    on_touch:
      - lambda: 'ESP_LOGI("touch", "x=%d y=%d", touch.x, touch.y);'

lvgl:
  displays: [lcd]
  touchscreens: [touch]
  buffer_size: 100%
  default_font: montserrat_20
  pages:
    - id: page_test
      bg_color: 0x000000
      widgets:
        - label:
            id: lbl_test
            align: CENTER
            text_color: 0xFFFFFF
            text: "Touch me"
        - button:
            id: btn_test
            x: 70
            y: 220
            width: 100
            height: 50
            widgets:
              - label:
                  align: CENTER
                  text: "Tap"
            on_click:
              - lvgl.label.update:
                  id: lbl_test
                  text: "Tapped!"
