    id: thermo2_mode
    entity_id: ${thermo2_entity}
    on_value:
      - lvgl.label.update: { id: thermo2_mode_lbl, text: !lambda 'return x;' }

script:
  - id: update_raid
    then:
      - lvgl.label.update:
          id: lbl_raid
          text: !lambda 'char b[40]; snprintf(b, sizeof(b), "RAID md0: %.0f active, %.0f failed", id(raid_active).state, id(raid_failed).state); return std::string(b);'
      - if:
          condition: { lambda: 'return id(raid_failed).state > 0;' }
          then: [ lvgl.label.update: { id: lbl_raid, text_color: 0xE04040 } ]
          else: [ lvgl.label.update: { id: lbl_raid, text_color: 0x40C040 } ]

spi:
  id: spi_lcd
  clk_pin: GPIO39
  mosi_pin: GPIO38
  miso_pin: GPIO40

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO1
    frequency: 1000 Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    dimensions:
      width: 240
      height: 320
    spi_id: spi_lcd
    cs_pin:
      number: GPIO45
      ignore_strapping_warning: true   # Waveshare wired LCD CS to a strapping pin; fine in practice
    dc_pin: GPIO42
    data_rate: 40MHz
    invert_colors: true      # IPS panel: Waveshare's demo constructs Arduino_ST7789 with ips=true
    color_order: bgr
    rotation: 0
    auto_clear_enabled: false
    update_interval: never   # LVGL drives redraws

i2c:
  id: i2c_tp
  sda: GPIO48
  scl: GPIO47
  frequency: 400kHz

touchscreen:
  - platform: cst816
    id: touch
    i2c_id: i2c_tp
    address: 0x15
    display: lcd
    update_interval: 50ms
    on_touch:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on:
                id: backlight
                brightness: 100%

lvgl:
  displays: [lcd]
  touchscreens: [touch]
  buffer_size: 100%
  default_font: montserrat_20
  on_idle:
    - timeout: 60s
      then:
        - light.turn_off: backlight
        - lvgl.pause:
  style_definitions:
    - id: tile_style
      bg_color: 0x1E2430
      bg_opa: COVER
      radius: 10
      border_width: 0
      pad_all: 6
    - id: row_style
      bg_color: 0x1E2430
      bg_opa: COVER
      radius: 8
      border_width: 0
      pad_all: 4
    - id: nav_style
      bg_color: 0x2A3242
      radius: 8
  top_layer:
    widgets:
      - label: { id: lbl_time, x: 8, y: 8, text: "--:--", text_color: 0xFFFFFF }
      - label: { id: lbl_title, align: TOP_MID, y: 8, text: "Rooms", text_color: 0xA0A8B8 }
